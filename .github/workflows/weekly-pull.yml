name: Sleeper weekly pull

on:
  schedule:
    # Wednesdays 15:00 UTC = 10:00 AM CDT (9:00 AM CST after Nov 1). GitHub may start it a few minutes late.
    - cron: "0 15 * 9-12,1 3"
  workflow_dispatch:
    inputs:
      completed_week:
        description: "Override completed week (blank = auto-detect)"
        required: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull from Sleeper
        run: |
          if [ -n "${{ github.event.inputs.completed_week }}" ]; then
            python sleeper_weekly_pull.py --completed-week "${{ github.event.inputs.completed_week }}"
          else
            python sleeper_weekly_pull.py
          fi
      - name: Commit output
        run: |
          git config user.name "sleeper-pull-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Weekly Sleeper pull $(date -u +%F)"
          git push
